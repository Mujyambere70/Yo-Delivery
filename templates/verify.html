{% extends "base.html" %}
{% block title %}Enter your code{% endblock %}
{% block content %}
<div class="wrap narrow">
    <form method="post" class="panel auth-form single" autocomplete="off">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <h1>Two-factor login</h1>
        <p class="muted">Open your authenticator app and type the 6-digit code for <b>Yo Delivery</b>.</p>
        <label for="code">One-time code</label>
        <input type="text" id="code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]{6,7}" maxlength="7" placeholder="123 456" required autofocus class="code-input">
        <button class="btn btn-orange btn-block btn-lg">Verify and continue</button>
        <p class="small muted">Lost your phone? Contact customer support to turn off two-factor login for you.</p>
        <p class="small"><a href="{{ url_for('login') }}">Back to sign in</a></p>
    </form>
</div>
{% endblock %}
