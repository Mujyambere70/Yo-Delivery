{% extends "base.html" %}
{% block title %}Choose a new password{% endblock %}
{% block content %}
<div class="wrap narrow">
    {% if ok %}
    <form method="post" class="panel auth-form single">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <h1>Choose a new password</h1>
        <label for="np1">New password</label><input type="password" id="np1" name="password" minlength="8" placeholder="At least 8 characters, letters + numbers" required autofocus>
        <label for="np2">Repeat the new password</label><input type="password" id="np2" name="password2" minlength="8" required>
        <button class="btn btn-orange btn-block">Save new password</button>
    </form>
    {% else %}
    <section class="panel empty"><h2>This link has expired or was already used</h2><p>Please ask for a new link.</p><a href="{{ url_for('forgot') }}" class="btn btn-orange">Get a new link</a></section>
    {% endif %}
</div>
{% endblock %}
