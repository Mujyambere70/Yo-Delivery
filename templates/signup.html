{% extends "base.html" %}
{% block title %}Create Account{% endblock %}
{% block content %}
<div class="auth">
    <div class="auth-side">
        <h2>Looks like you're new here!</h2>
        <p>Sign up and get <b>₹2,000</b> demo Yo Pay balance + <b>₹100 off</b> your first order with WELCOME100.</p>
        <img src="{{ url_for('static', filename='images/products/trailpack-30l-2.jpg') }}" alt="">
    </div>
    <form method="post" class="auth-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
        <h1>Create account</h1>
        <label for="name">Your name</label><input type="text" id="name" name="name" value="{{ form.get('name', '') }}" placeholder="First and last name" required>
        <label for="mobile">Mobile number</label><div class="prefix"><span>+91</span><input type="tel" id="mobile" name="mobile" value="{{ form.get('mobile', '') }}" pattern="[6-9][0-9]{9}" maxlength="10" required></div>
        <label for="email">Email</label><input type="email" id="email" name="email" value="{{ form.get('email', '') }}" required>
        <label for="password">Password</label><input type="password" id="password" name="password" minlength="8" placeholder="At least 8 characters, letters + numbers" required>
        <label for="password2">Re-enter password</label><input type="password" id="password2" name="password2" minlength="8" required>
        <button type="submit" class="btn btn-orange btn-block btn-lg">Create account</button>
        <p class="small">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p>
    </form>
</div>
{% endblock %}
